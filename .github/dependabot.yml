---
version: 2

updates:
  - package-ecosystem: "docker-compose"
    directories:
      - "/applications"
      - "/monitoring"
      - "/operations"
      - "/storage"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Detroit"
    ignore:
      - dependency-name: "grafana/grafana"
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly